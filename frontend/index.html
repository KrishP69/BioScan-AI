<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioScan AI - Smart Face Recognition Attendance Management System</title>
    <!-- Modern Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="dark-theme">
    <!-- WebGL Three.js Interactive Cybernetic 3D Background Canvas -->
    <canvas id="webgl-3d-bg" class="webgl-3d-bg"></canvas>

    <!-- Dynamic 3D Volumetric Cursor Spotlight -->
    <div id="cursor-glow" class="cursor-glow"></div>

    <!-- Background dynamic ambient glow -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <!-- Navigation Header -->
    <header id="main-header" class="site-header">
        <div class="header-container">
            <a href="/" class="brand-logo" onclick="app.navigate('/'); return false;">
                <div class="logo-icon-box">
                    <i class="fa-solid fa-expand"></i>
                    <i class="fa-solid fa-face-viewfinder inner-icon"></i>
                </div>
                <div class="brand-text">
                    <span class="brand-name">BioScan <span class="brand-highlight">AI</span></span>
                    <span class="brand-tagline">Face Recognition Attendance</span>
                </div>
            </a>

            <!-- Dynamic Navbar Actions -->
            <nav id="navbar-links" class="nav-links">
                <!-- Injected dynamically based on auth state -->
            </nav>

            <!-- Header Right Actions: Clock & User Profile -->
            <div class="header-right-actions">
                <!-- Real-Time IST Digital Clock Widget -->
                <div id="header-ist-clock" class="header-ist-clock" title="Indian Standard Time (IST, UTC+5:30) Live Clock">
                    <!-- Injected by startLiveISTClock -->
                </div>

                <div id="nav-user-profile" class="nav-user-profile">
                    <!-- User chip & logout button injected dynamically -->
                </div>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Application Container -->
    <main id="app-viewport" class="app-viewport">
        <!-- Views are rendered here by the SPA Router -->
        <div class="loading-state">
            <div class="scanner-spinner"></div>
            <p>Initializing AI Biometric Engine...</p>
        </div>
    </main>

    <!-- Global Modal Container -->
    <div id="global-modal-overlay" class="modal-overlay hidden">
        <div id="global-modal-box" class="modal-card">
            <!-- Modal header, body, footer injected by UI modal manager -->
        </div>
    </div>

    <!-- Global Audio for Attendance Recognition Chime -->
    <audio id="audio-success" preload="auto">
        <source src="data:audio/wav;base64,UklGRl9vT19XQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YU..." type="audio/wav">
    </audio>

    <!-- Global Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Application Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/js/face-api.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/3d_engine.js"></script>
    <script src="/js/face_engine.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
